<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Guto Kilishi Viral Ad</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0d0102;}
  canvas{display:block;width:100vw;max-width:calc(100vh*9/16);margin:0 auto;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// GUTO KILISHI — 12s scroll-stopper, 9:16.
// Every visual beat lives in T / EVENTS below; audio.py reads the same EVENTS (exported to events.json)
// so each sound effect lands on the exact frame of its visual.
const W=1080,H=1920,DURATION=12;
const cv=document.getElementById('c'); let ctx=cv.getContext('2d');
const C={red:'#b3121c',redHot:'#e0202c',crimson:'#8f0b16',maroon:'#3a0408',night:'#120103',gold:'#ffb53d',goldHot:'#ffe2a0',white:'#fff8f3',yellow:'#ffd23f'};
const IMPACT='"Anton", Impact, sans-serif', BODY='"Montserrat", Arial, sans-serif', SCRIPT='"Kaushan Script", cursive';

// ================= TIMELINE (single source of truth) =================
const T={
  rip:.40, burst:.50, toWords:1.15,
  words:[1.25,1.5,1.75,2.0,2.25], kilishi:2.5, crownFall:2.72, crownLand:3.0,
  spin:3.25, land:3.6, call:[3.9,4.2,4.5],
  heat:5.0, meter0:5.1, meter1:6.2, hot:6.25, slash:6.75, split:6.85,
  bite0:7.0, crunch:[7.4,7.75], hooked:7.9,
  montage:[8.0,8.5,9.0,9.5], riser:9.5, end:10.0, endLand:10.32, tagline:10.45, cta:10.7, handle:10.9
};
const EVENTS=[
  [0,'rumble',{dur:.4}],[.05,'pop',{pitch:1.3}],[T.rip,'rip'],[T.burst,'burst'],[T.burst,'music_on'],
  [T.toWords,'whoosh',{dur:.18,pan:0}],
  ...T.words.map((t,i)=>[t,'slam',{pitch:[1,1.12,.9,1.25,1.4][i]}]),
  [T.kilishi,'slam_big'],[T.crownFall,'whoosh',{dur:.28,pan:0,down:1}],[T.crownLand,'clink'],
  [T.spin-.05,'whoosh',{dur:.38,pan:-.8}],[T.land,'thud'],
  ...T.call.map((t,i)=>[t,'pop',{pitch:1+i*.18}]),
  [T.heat,'fire',{dur:T.slash-T.heat}],
  ...Array.from({length:12},(_,i)=>[T.meter0+i*(T.meter1-T.meter0)/11,'tick',{pitch:1+i*.09}]),
  [T.hot,'boom'],[T.slash,'slash'],[T.split,'whoosh',{dur:.2,pan:.6}],
  [T.bite0,'music_off'],[T.crunch[0],'crunch'],[T.crunch[1],'crunch',{pitch:1.15}],[T.hooked,'slam_big'],[T.hooked+.1,'music_on'],
  ...T.montage.map(t=>[t,'shutter']),[T.riser,'riser',{dur:T.end-T.riser}],
  [T.end,'boom'],[T.endLand,'thud'],[T.tagline,'sparkle'],[T.cta,'pop',{pitch:1.5}],[T.handle,'shimmer'],
];
window.EVENTS=EVENTS.map(([t,type,p])=>({t:+t.toFixed(3),type,...(p||{})}));

// ================= helpers =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const easeOutCubic=x=>1-Math.pow(1-x,3);
const easeOutExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const easeInCubic=x=>x*x*x;
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutBack=x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function bounceOut(x){const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375;}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});}
function spacing(px){if('letterSpacing' in ctx)ctx.letterSpacing=px+'px';}
const TAU=Math.PI*2;
const since=(t,a)=>t-a;

// ================= ingredients =================
function makeChip(seed,size){
  const r=mulberry32(seed),n=12,pts=[];
  for(let i=0;i<n;i++){const a=i/n*TAU+(r()-.5)*.35;const rad=size*(.6+r()*.45)*(i%2?.8:1);pts.push([Math.cos(a)*rad*1.25,Math.sin(a)*rad*.8]);}
  const seeds=Array.from({length:Math.floor(size*.9)},()=>({x:(r()-.5)*size*2.2,y:(r()-.5)*size*1.4,s:(2+r()*4)*size/70,c:r()<.6?'#e9a23b':(r()<.6?'#ffcf6b':'#c4531f')}));
  const specks=Array.from({length:Math.floor(size*.7)},()=>({x:(r()-.5)*size*2.2,y:(r()-.5)*size*1.4,s:(1.5+r()*3)*size/70}));
  const veins=Array.from({length:6},()=>({y:(r()-.5)*size*1.1,a:.2+r()*.3}));
  return {kind:'chip',pts,seeds,specks,veins,hue:r(),size};
}
function chipPath(ch){ctx.beginPath();ch.pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();}
function drawChip(ch){
  if(LIFE){ // real kilishi texture cut from the photo of the bowl
    const r=mulberry32(Math.floor(ch.hue*1e6)),sx=10+r()*230,sy=790+r()*120,sw=170,sh=110,s=ch.size;
    ctx.save();chipPath(ch);ctx.fillStyle='#4a1008';ctx.fill();ctx.clip();ctx.drawImage(LIFE,sx,sy,sw,sh,-s*1.35,-s*.9,s*2.7,s*1.8);
    const hl=ctx.createLinearGradient(-s,-s*.8,s,s*.8);hl.addColorStop(0,'rgba(255,200,150,.16)');hl.addColorStop(.5,'rgba(0,0,0,0)');hl.addColorStop(1,'rgba(0,0,0,.25)');ctx.fillStyle=hl;ctx.fillRect(-s*1.4,-s,s*2.8,s*2);ctx.restore();
    chipPath(ch);ctx.strokeStyle='rgba(30,3,0,.6)';ctx.lineWidth=Math.max(2,s*.025);ctx.stroke();return;}
  chipPath(ch); const s=ch.size, g=ctx.createLinearGradient(-s,-s*.6,s,s*.6);
  g.addColorStop(0,ch.hue>.5?'#8a2412':'#7a1c10'); g.addColorStop(.5,'#5a1209'); g.addColorStop(1,'#a3361a');
  ctx.fillStyle=g; ctx.fill();
  ctx.save(); chipPath(ch); ctx.clip();
  for(const v of ch.veins){ctx.strokeStyle=`rgba(30,4,0,${v.a})`;ctx.lineWidth=s*.04;ctx.beginPath();ctx.moveTo(-s*1.3,v.y);ctx.quadraticCurveTo(0,v.y+s*.2,s*1.3,v.y-s*.1);ctx.stroke();}
  for(const p of ch.specks){ctx.fillStyle='rgba(30,4,0,.7)';ctx.fillRect(p.x,p.y,p.s,p.s);}
  for(const p of ch.seeds){ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(p.x,p.y,p.s,p.s*.6,p.x,0,TAU);ctx.fill();}
  ctx.restore();
  chipPath(ch); ctx.strokeStyle='rgba(40,4,0,.6)'; ctx.lineWidth=s*.035; ctx.stroke();
}
function makeChili(seed){
  const r=mulberry32(seed);const len=240+r()*110,wid=44+r()*16,curl=(r()-.5)*120,droop=(r()-.5)*60,N=26,top=[],bot=[];
  for(let i=0;i<=N;i++){const u=i/N,x=-len/2+u*len,cy=curl*4*u*(1-u)+droop*u*u,dy=curl*4*(1-2*u)/len+droop*2*u/len,nl=Math.hypot(dy,1);
    let hw=wid/2*Math.pow(1-Math.pow(u,2.4),.7)*(u<.1?.8+2*u:1);hw*=1+.06*Math.sin(u*40+seed);
    top.push([x+dy/nl*hw,cy-hw/nl]);bot.push([x-dy/nl*hw,cy+hw/nl]);}
  return {kind:'chili',len,wid,top,bot,curl};
}
function drawChili(c){
  const path=()=>{ctx.beginPath();ctx.moveTo(...c.top[0]);c.top.forEach(p=>ctx.lineTo(...p));for(let i=c.bot.length-1;i>=0;i--)ctx.lineTo(...c.bot[i]);ctx.closePath();};
  path();const g=ctx.createLinearGradient(0,-c.wid*.6+c.curl*.5,0,c.wid*.6+c.curl*.5);
  g.addColorStop(0,'#4a0303');g.addColorStop(.3,'#b8140e');g.addColorStop(.42,'#ec4a34');g.addColorStop(.6,'#9a0b07');g.addColorStop(1,'#2c0101');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(255,210,190,.35)';ctx.lineWidth=c.wid*.09;ctx.lineCap='round';ctx.beginPath();
  c.top.forEach((p,i)=>{if(i<3||i>c.top.length-4)return;const q=c.bot[i];const x=lerp(p[0],q[0],.28),y=lerp(p[1],q[1],.28);i===3?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  const s=c.top[0],b=c.bot[0],mx=(s[0]+b[0])/2,my=(s[1]+b[1])/2;
  ctx.fillStyle='#5b5a1c';ctx.beginPath();ctx.ellipse(mx-4,my,10,c.wid*.42,0,0,TAU);ctx.fill();
  ctx.strokeStyle='#6f6a22';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(mx-8,my);ctx.quadraticCurveTo(mx-30,my-6,mx-44,my-22);ctx.stroke();
}
function makePepper(seed){const r=mulberry32(seed);return {kind:'pepper',r:12+r()*5,ph:r()*TAU};}
function drawPepper(p){const g=ctx.createRadialGradient(-p.r*.35,-p.r*.35,p.r*.1,0,0,p.r);g.addColorStop(0,'#7a5a44');g.addColorStop(.45,'#2e1a10');g.addColorStop(1,'#0e0604');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,p.r,0,TAU);ctx.fill();}
function drawItem(it,x,y,rot,sc,alpha=1,shadow=true){
  if(alpha<=0||sc<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);ctx.globalAlpha*=alpha;
  if(shadow){ctx.shadowColor='rgba(20,0,0,.5)';ctx.shadowBlur=24;ctx.shadowOffsetY=12;}
  if(it.kind==='chip')drawChip(it);else if(it.kind==='chili')drawChili(it);else drawPepper(it);ctx.restore();
}
const ING=[];for(let i=0;i<48;i++)ING.push(i%3===0?makeChili(300+i):i%3===1?makeChip(500+i,60+(i%4)*14):makePepper(700+i));
const CHIPS=Array.from({length:16},(_,i)=>makeChip(1200+i*7,70+(i%4)*16));
const _pc={};function makePepperCached(i){return _pc[i]||(_pc[i]=makePepper(800+i));}
const itemScale=it=>it.kind==='chili'?.55:it.kind==='chip'?.9:1.2;

// ================= pack =================
let FRONT,BACK,LIFE=null,STUDIO,RETAIL,BOWL,CHILI,RETAILPACK;const PACK_AR=840/533;
function drawPack(x,y,h,rot=0,theta=0,glare=-1){
  const c=Math.cos(theta),img=c>=0?FRONT:BACK,w=h/PACK_AR,sx=Math.max(Math.abs(c),.02);
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sx,1);
  ctx.shadowColor='rgba(15,0,0,.6)';ctx.shadowBlur=70;ctx.shadowOffsetY=40;
  ctx.drawImage(img,-w/2,-h/2,w,h);ctx.shadowColor='transparent';
  rrect(-w/2+4,-h/2+4,w-8,h-8,w*.05);ctx.clip();
  const shade=(1-Math.abs(c))*.55;if(shade>.01){ctx.fillStyle=`rgba(30,0,0,${shade})`;ctx.fillRect(-w/2,-h/2,w,h);}
  if(glare>=0&&glare<=1){const gx=lerp(-w*1.4,w*1.4,glare);const g=ctx.createLinearGradient(gx-w*.35,-h/2,gx+w*.35,h/2);
    g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,245,230,.4)');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(-w/2,-h/2,w,h);}
  ctx.restore();
}
// torn pack: jagged tear line across the top, top strip flies away
const TEAR=(()=>{const r=mulberry32(4),pts=[];for(let i=0;i<=22;i++)pts.push([i/22,.105+(i%2?.018:-.012)+(r()-.5)*.012]);return pts;})();
function tearPath(w,h,above){
  ctx.beginPath();
  if(above){ctx.moveTo(-w/2-5,-h/2-5);ctx.lineTo(w/2+5,-h/2-5);}else{ctx.moveTo(-w/2-5,h/2+5);ctx.lineTo(w/2+5,h/2+5);}
  const pts=above?TEAR.slice().reverse():TEAR;
  if(above){for(const [u,v] of pts)ctx.lineTo(-w/2+u*w,-h/2+v*h);}else{for(let i=pts.length-1;i>=0;i--){const [u,v]=pts[i];ctx.lineTo(-w/2+u*w,-h/2+v*h);}}
  ctx.closePath();
}
function drawTornPack(x,y,h,tp,rot=0){
  const w=h/PACK_AR;
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  // body
  ctx.save();tearPath(w,h,false);ctx.clip();
  ctx.shadowColor='rgba(15,0,0,.6)';ctx.shadowBlur=70;ctx.shadowOffsetY=40;ctx.drawImage(FRONT,-w/2,-h/2,w,h);ctx.restore();
  if(tp>0){ // dark opening
    ctx.fillStyle='rgba(25,2,2,.92)';ctx.beginPath();ctx.ellipse(0,-h/2+h*.11,w*.47,h*.022+h*.02*clamp(tp*3),0,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,240,225,.9)';TEAR.forEach(([u,v],i)=>{if(i%2)ctx.fillRect(-w/2+u*w-2,-h/2+v*h-2,4,4);});
  }
  // top strip
  const e=easeOutCubic(clamp(tp));
  ctx.save();ctx.translate(e*w*.9,-e*h*.75);ctx.rotate(e*.9);
  tearPath(w,h,true);ctx.clip();ctx.drawImage(FRONT,-w/2,-h/2,w,h);ctx.restore();
  ctx.restore();
}

// ================= crown =================
function crown(x,y,s,glow=0){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  if(glow>0){ctx.shadowColor=`rgba(255,200,90,${glow})`;ctx.shadowBlur=60;}
  const g=ctx.createLinearGradient(0,-90,0,60);g.addColorStop(0,'#fff0b0');g.addColorStop(.45,'#ffc23d');g.addColorStop(1,'#b0700e');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-120,50);ctx.lineTo(-135,-55);ctx.lineTo(-62,5);ctx.lineTo(0,-85);ctx.lineTo(62,5);ctx.lineTo(135,-55);ctx.lineTo(120,50);ctx.closePath();ctx.fill();
  ctx.shadowColor='transparent';
  ctx.fillStyle='#a0630c';rrect(-124,38,248,34,10);ctx.fill();
  for(const [bx,by,r] of [[-135,-62,14],[0,-95,16],[135,-62,14]]){const bg=ctx.createRadialGradient(bx-4,by-5,2,bx,by,r);bg.addColorStop(0,'#fff6d0');bg.addColorStop(1,'#d08a14');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bx,by,r,0,TAU);ctx.fill();}
  for(const [gx,col] of [[-60,'#e0202c'],[0,'#ffffff'],[60,'#e0202c']]){ctx.fillStyle=col;ctx.beginPath();ctx.arc(gx,55,9,0,TAU);ctx.fill();}
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-110,30);ctx.lineTo(-118,-30);ctx.stroke();
  ctx.restore();
}
function sparkles(x,y,t0,t,n=14,rad=260,seed=2){
  const d=t-t0;if(d<0||d>.8)return;const r=mulberry32(seed);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){const a=r()*TAU,sp=rad*(.5+r()*.8),k=easeOutCubic(d/.8);const px=x+Math.cos(a)*sp*k,py=y+Math.sin(a)*sp*k,s=(10+r()*16)*(1-d/.8);
    ctx.fillStyle=`rgba(255,${200+Math.floor(r()*55)},120,${1-d/.8})`;ctx.beginPath();ctx.moveTo(px,py-s);ctx.lineTo(px+s*.25,py);ctx.lineTo(px,py+s);ctx.lineTo(px-s*.25,py);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(px-s,py);ctx.lineTo(px,py+s*.25);ctx.lineTo(px+s,py);ctx.lineTo(px,py-s*.25);ctx.closePath();ctx.fill();}
  ctx.restore();
}

// ================= backgrounds / FX =================
function photoBg(img,fx,fy,zoom,blur,overlay,rot=0){ctx.save();if(blur)ctx.filter=`blur(${blur}px)`;photo(img,fx,fy,zoom,rot);ctx.restore();if(overlay){ctx.fillStyle=overlay;ctx.fillRect(0,0,W,H);}}
function cut(img,x,y,w,rot=0,alpha=1,flip=false,shadow=true){if(!img||alpha<=0)return;const h=w*img.height/img.width;ctx.save();ctx.translate(x,y);ctx.rotate(rot);if(flip)ctx.scale(-1,1);ctx.globalAlpha*=alpha;
  if(shadow){ctx.shadowColor='rgba(15,0,0,.55)';ctx.shadowBlur=50;ctx.shadowOffsetY=28;}ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();}
function radialBg(c0,c1,cx=W/2,cy=H/2,r=1300){const g=ctx.createRadialGradient(cx,cy,40,cx,cy,r);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function rays(cx,cy,t,col='#fff',a=.07,n=18){ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.15);ctx.globalAlpha=a;ctx.fillStyle=col;for(let i=0;i<n;i++){ctx.rotate(TAU/n);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(1800,-110);ctx.lineTo(1800,110);ctx.closePath();ctx.fill();}ctx.restore();}
const rnd=mulberry32(42);
const DUST=Array.from({length:200},()=>({x:rnd()*W,y:rnd()*H,z:rnd(),s:1+rnd()*3.5,c:rnd()<.5?'#e07a2c':(rnd()<.5?'#ffcf80':'#a3260f'),sp:20+rnd()*80,ph:rnd()*TAU}));
function dust(t,alpha=1,dir=1){for(const d of DUST){const y=(d.y+t*d.sp*dir*(1+d.z)+H*4)%H,x=d.x+Math.sin(t+d.ph)*20;ctx.globalAlpha=alpha*(.3+.6*d.z);ctx.fillStyle=d.c;ctx.fillRect(x,y,d.s*(1+d.z),d.s*(1+d.z));}ctx.globalAlpha=1;}
function vignette(a=.6){const v=ctx.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.78);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(8,0,0,${a})`);ctx.fillStyle=v;ctx.fillRect(0,0,W,H);}
let GRAIN=null;
function makeGrain(){GRAIN=document.createElement('canvas');GRAIN.width=360;GRAIN.height=640;const g=GRAIN.getContext('2d'),id=g.createImageData(360,640),r=mulberry32(99);
  for(let i=0;i<id.data.length;i+=4){const v=Math.floor(r()*255);id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}g.putImageData(id,0,0);}
function grain(t){const f=Math.floor(t*30);ctx.save();ctx.globalAlpha=.045;ctx.globalCompositeOperation='overlay';ctx.translate(-(f*53)%360,-(f*97)%640);ctx.scale(3,3);
  ctx.fillStyle=ctx.createPattern(GRAIN,'repeat');ctx.fillRect(0,0,W/1.5,H/1.5);ctx.restore();}

// big kinetic text: slams in, auto-fits to maxW
function slamText(text,x,y,maxSize,maxW,p,fg,{font=IMPACT,rot=0,stroke=null,glow=null,from=1.7}={}){
  if(p<=0)return;ctx.save();ctx.font=`${maxSize}px ${font}`;const m=ctx.measureText(text).width;const size=Math.min(maxSize,maxSize*maxW/m);
  const e=easeOutExpo(clamp(p/.35));const s=lerp(from,1,e);
  ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.globalAlpha*=clamp(p*16);
  ctx.font=`${size}px ${font}`;ctx.textAlign='center';ctx.textBaseline='middle';
  if(glow){ctx.shadowColor=glow;ctx.shadowBlur=50;}
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=size*.1;ctx.strokeStyle=stroke;ctx.strokeText(text,0,0);}
  ctx.fillStyle=fg;ctx.fillText(text,0,0);ctx.restore();
}
function tag(text,x,y,size,p,{bg=C.yellow,fg=C.night,rot=-.05}={}){
  if(p<=0)return;ctx.save();ctx.font=`${size}px ${IMPACT}`;const w=ctx.measureText(text).width+size*.7,h=size*1.3;
  const e=easeOutBack(clamp(p/.3));ctx.translate(x,y);ctx.rotate(rot);ctx.scale(e,e);
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=30;ctx.shadowOffsetY=10;ctx.fillStyle=bg;ctx.fillRect(-w/2,-h/2,w,h);ctx.shadowColor='transparent';
  ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,0,size*.05);ctx.restore();
}

// ================= flames =================
const FL=Array.from({length:150},(_,i)=>{const r=mulberry32(900+i);return {x:r()*W,sp:500+r()*600,size:60+r()*120,off:r(),sway:r()*TAU,life:.8+r()*.6};});
function flames(t,intensity,front=false){
  if(intensity<=0)return;ctx.save();ctx.globalCompositeOperation='lighter';
  FL.forEach((f,i)=>{if(front!==(i%4===0))return;

// ================= compositor =================
function shake(t){
  const hits=[[T.rip,14],[T.burst,40],...T.words.map(w=>[w,16]),[T.kilishi,22],[T.crownLand,18],[T.land,30],[T.hot,34],[T.crunch[0],30],[T.crunch[1],30],[T.hooked,18],[T.end,26],[T.endLand,20]];
  let x=0,y=0;for(const [ti,a] of hits){const d=t-ti;if(d>0&&d<.5){const k=a*Math.exp(-d*12);x+=k*Math.sin(d*77);y+=k*Math.cos(d*91);}}
  if(t>=T.heat&&t<T.slash){const k=4*prog(t,T.meter0,T.meter1);x+=Math.sin(t*61)*k;y+=Math.cos(t*53)*k;}
  return [x,y];
}
function drawScene(t){
  if(t<T.words[0])return sceneHook(t);
  if(t<T.kilishi)return sceneWords(t);
  if(t<T.spin)return sceneKilishi(t);
  if(t<T.heat)return sceneProduct(t);
  if(t<T.split)return sceneHeat(t);
  if(t<T.montage[0])return sceneBite(t);
  if(t<T.end)return sceneMontage(t);
  return sceneEnd(t);
}
function drawFrame(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';ctx.globalCompositeOperation='source-over';
  const [sx,sy]=shake(t);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(sx,sy);ctx.translate(W/2,H/2);ctx.scale(1.03,1.03);ctx.translate(-W/2,-H/2); // overscan hides shake edges
  if(t>=T.split&&t<T.split+.2){ // diagonal split: heat scene tears apart revealing the bite scene
    sceneBite(t);const k=easeInCubic(prog(t,T.split,T.split+.2))*1400;const nx=.6,ny=.8;
    for(const sgn of [-1,1]){ctx.save();ctx.beginPath();
      if(sgn<0){ctx.moveTo(-200,-200);ctx.lineTo(W+200,-200);ctx.lineTo(W+200,300);ctx.lineTo(-200,1700);}else{ctx.moveTo(-200,1700);ctx.lineTo(W+200,300);ctx.lineTo(W+200,H+200);ctx.lineTo(-200,H+200);}
      ctx.closePath();ctx.translate(sgn*-nx*k,sgn*-ny*k*.4);ctx.clip();sceneHeat(T.split-.001);ctx.restore();}
  } else drawScene(t);
  // chili slash streak
  if(t>=T.slash&&t<T.split+.05){const p=prog(t,T.slash,T.split);const x=lerp(-250,W+250,p),y=lerp(1700,300,p);
    ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createLinearGradient(x-600,y+560,x,y);g.addColorStop(0,'rgba(255,200,120,0)');g.addColorStop(1,'rgba(255,230,180,.9)');
    ctx.strokeStyle=g;ctx.lineWidth=26;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-600,y+560);ctx.lineTo(x,y);ctx.stroke();ctx.restore();
    cut(CHILI,x,y,520,-.75,1,false,false);}
  ctx.restore();
  // flashes on the big hits
  const flashes=[[T.burst,.9],[T.words[0],.5],[T.kilishi,.4],[T.hot,.35],[T.crunch[0],.3],[T.crunch[1],.3],...T.montage.map(m=>[m,.55]),[T.end,.7]];
  for(const [ft,a] of flashes){const d=t-ft;if(d>=0&&d<.12){ctx.fillStyle=`rgba(255,248,240,${a*(1-d/.12)})`;ctx.fillRect(0,0,W,H);}}
  grain(t);
  if(t<.06){ctx.fillStyle=`rgba(0,0,0,${1-t/.06})`;ctx.fillRect(0,0,W,H);}
}
window.drawFrame=drawFrame;
window.ready=Promise.all([loadImg('assets/pack_front.png'),loadImg('assets/pack_back.png'),loadImg('assets/lifestyle.jpg'),loadImg('assets/pack_studio.jpg'),loadImg('assets/retail.jpg'),loadImg('assets/cut_kilishi_bowl.png'),loadImg('assets/cut_chili1.png'),loadImg('assets/cut_retail_pack.png'),
  document.fonts.load('100px Anton'),document.fonts.load('64px "Kaushan Script"'),document.fonts.load('800 40px Montserrat'),document.fonts.load('900 40px Montserrat')])
  .then(([f,b,l,s,rt,bw,ch,rp])=>{FRONT=f;BACK=b;LIFE=l;STUDIO=s;RETAIL=rt;BOWL=bw;CHILI=ch;RETAILPACK=rp;makeGrain();OFF=document.createElement('canvas');OFF.width=W;OFF.height=H;OCTX=OFF.getContext('2d');return document.fonts.ready;});
if(!location.search.includes('render')){
  window.ready.then(()=>{const t0=performance.now();(function loop(){drawFrame(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop);})();});
}
</script>

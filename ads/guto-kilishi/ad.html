<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Guto Kilishi Ad</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Kaushan+Script&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#2a0306;}
  canvas{display:block;width:100vw;max-width:calc(100vh*9/16);margin:0 auto;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Guto Kilishi — 10-second vertical (9:16) ad. Deterministic: drawFrame(t) renders any moment.
const W=1080, H=1920, DURATION=10;
const cv=document.getElementById('c'); const ctx=cv.getContext('2d');

const C={ red:'#b3121c', redDeep:'#7c0a12', redDark:'#4a0509', white:'#fff8f3', cream:'#ffe9d6', gold:'#f2a93b', ink:'#2a0306' };
const HEAD='"Baloo 2", "Arial Rounded MT Bold", Arial, sans-serif';
const SCRIPT='"Kaushan Script", cursive';
const BODY='"Montserrat", Arial, sans-serif';

// ---------- helpers ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const easeOutCubic=x=>1-Math.pow(1-x,3);
const easeInCubic=x=>x*x*x;
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function bounceOut(x){const n=7.5625,d=2.75;
  if(x<1/d)return n*x*x; if(x<2/d)return n*(x-=1.5/d)*x+.75;
  if(x<2.5/d)return n*(x-=2.25/d)*x+.9375; return n*(x-=2.625/d)*x+.984375;}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function spacing(px){ if('letterSpacing' in ctx) ctx.letterSpacing=px+'px'; }
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});}

// ---------- kilishi chip generator (thin, jagged, spice-coated sheets) ----------
function makeChip(seed,size){
  const r=mulberry32(seed), n=11, pts=[];
  for(let i=0;i<n;i++){const a=i/n*6.283+(r()-.5)*.4; const rad=size*(.55+r()*.5)*(i%2?.78:1);
    pts.push([Math.cos(a)*rad*1.25,Math.sin(a)*rad*.8]);}
  const seeds=Array.from({length:Math.floor(size*.5)},()=>({x:(r()-.5)*size*2,y:(r()-.5)*size*1.3,s:2+r()*4,c:r()<.6?'#e9a23b':'#ffcf6b'}));
  const specks=Array.from({length:Math.floor(size*.4)},()=>({x:(r()-.5)*size*2,y:(r()-.5)*size*1.3,s:1.5+r()*3}));
  const hue=r(); return {pts,seeds,specks,hue};
}
function drawChip(ch,x,y,rot,sc,alpha=1){
  if(alpha<=0) return;
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(sc,sc); ctx.globalAlpha*=alpha;
  const path=()=>{ctx.beginPath();ch.pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();};
  ctx.shadowColor='rgba(40,0,0,.5)'; ctx.shadowBlur=18; ctx.shadowOffsetY=10;
  path(); const g=ctx.createLinearGradient(-60,-40,60,40);
  g.addColorStop(0,ch.hue>.5?'#8a2412':'#7a1c10'); g.addColorStop(.5,'#5a1209'); g.addColorStop(1,'#9b3216');
  ctx.fillStyle=g; ctx.fill(); ctx.shadowColor='transparent';
  ctx.save(); path(); ctx.clip();
  for(const s of ch.specks){ctx.fillStyle='rgba(30,4,0,.7)';ctx.fillRect(s.x,s.y,s.s,s.s);}
  for(const s of ch.seeds){ctx.fillStyle=s.c;ctx.beginPath();ctx.ellipse(s.x,s.y,s.s,s.s*.6,s.x,0,6.283);ctx.fill();}
  ctx.restore();
  path(); ctx.strokeStyle='rgba(40,4,0,.6)'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.restore();
}
const chips=Array.from({length:9},(_,i)=>makeChip(100+i*17,70+(i%3)*18));

// ---------- particles: chili flakes & seeds drifting ----------
const rnd=mulberry32(5);
const flakes=Array.from({length:80},()=>({x:rnd()*W,sp:70+rnd()*170,s:3+rnd()*9,off:rnd()*3000,ph:rnd()*6.28,rs:(rnd()-.5)*6,c:rnd()<.5?'#ffd08a':(rnd()<.5?'#ff5a3c':'#ffffff'),a:.35+rnd()*.5}));

// ---------- camera shake ----------
const IMPACTS=[[.4,18],[1.05,20],[2.95,36],[3.55,12],[8.25,14],[8.6,16]];
function shake(t){let x=0,y=0;for(const [ti,a] of IMPACTS){const d=t-ti;if(d>0&&d<.6){const k=a*Math.exp(-d*9);x+=k*Math.sin(d*71);y+=k*Math.cos(d*93);}}return [x,y];}

// ---------- text ----------
function stamp(text,x,y,size,p,color,font=HEAD,weight='800',stroke=null){
  if(p<=0) return;
  const e=easeOutBack(clamp(p)); const s=lerp(2.3,1,clamp(e,0,1.2)); const a=clamp(p*3.5);
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.globalAlpha*=a;
  ctx.font=`${weight} ${size}px ${font}`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=26; ctx.shadowOffsetY=8;
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=size*.12;ctx.strokeStyle=stroke;ctx.strokeText(text,0,0);ctx.shadowColor='transparent';}
  ctx.fillStyle=color; ctx.fillText(text,0,0); ctx.restore();
}

// ---------- badge icons (simple line icons echoing the pack) ----------
function icon(kind){
  ctx.strokeStyle=C.white; ctx.fillStyle=C.white; ctx.lineWidth=6; ctx.lineCap='round'; ctx.lineJoin='round';
  if(kind==='protein'){ // dumbbell
    ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(16,0); ctx.stroke();
    rrect(-30,-16,10,32,4); ctx.fill(); rrect(20,-16,10,32,4); ctx.fill();
    rrect(-20,-11,6,22,3); ctx.fill(); rrect(14,-11,6,22,3); ctx.fill();
  } else if(kind==='shield'){
    ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(22,-16); ctx.lineTo(20,6); ctx.quadraticCurveTo(14,20,0,28); ctx.quadraticCurveTo(-14,20,-20,6); ctx.lineTo(-22,-16); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-9,1); ctx.lineTo(-2,9); ctx.lineTo(11,-7); ctx.stroke();
  } else { // heart
    ctx.beginPath(); ctx.moveTo(0,22); ctx.bezierCurveTo(-34,0,-22,-28,0,-10); ctx.bezierCurveTo(22,-28,34,0,0,22); ctx.fill();
  }
}
function badge(label,sub,x,y,p,kind){
  if(p<=0) return;
  const e=easeOutBack(clamp(p)); ctx.save(); ctx.translate(lerp(W+520,x,e),y);
  ctx.shadowColor='rgba(40,0,0,.35)'; ctx.shadowBlur=30; ctx.shadowOffsetY=12;
  rrect(-400,-68,800,136,68); ctx.fillStyle=C.white; ctx.fill(); ctx.shadowColor='transparent';
  ctx.fillStyle=C.red; ctx.beginPath(); ctx.arc(-332,0,50,0,6.283); ctx.fill();
  ctx.save(); ctx.translate(-332,0); icon(kind); ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle=C.red; ctx.font=`800 56px ${HEAD}`; ctx.fillText(label,-256,-10);
  ctx.fillStyle='rgba(124,10,18,.7)'; ctx.font=`600 25px ${BODY}`; spacing(2); ctx.fillText(sub,-254,38); spacing(0);
  ctx.restore();
}

// ---------- backgrounds ----------
function redStage(t){
  const g=ctx.createRadialGradient(W/2,780,80,W/2,900,1300);
  g.addColorStop(0,'#d61d27'); g.addColorStop(.55,C.red); g.addColorStop(1,C.redDeep);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // soft halftone rays
  ctx.save(); ctx.translate(W/2,820); ctx.rotate(t*.08); ctx.globalAlpha=.07; ctx.fillStyle='#fff';
  for(let i=0;i<16;i++){ctx.rotate(6.283/16);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(1500,-120);ctx.lineTo(1500,120);ctx.closePath();ctx.fill();}
  ctx.restore();
}
function flakesLayer(t,alpha=1){
  for(const f of flakes){
    const y=((t*f.sp+f.off)%(H+100))-50; const x=f.x+Math.sin(t*1.3+f.ph)*30;
    ctx.save(); ctx.translate(x,y); ctx.rotate(t*f.rs); ctx.globalAlpha=f.a*alpha; ctx.fillStyle=f.c;
    ctx.beginPath(); ctx.ellipse(0,0,f.s,f.s*.55,0,0,6.283); ctx.fill(); ctx.restore();
  }
}

let PACK=null, PHOTO=null;
function drawPack(x,y,sc,rot){
  const w=600, h=w*PACK.height/PACK.width;
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(sc,sc);
  ctx.shadowColor='rgba(40,0,0,.55)'; ctx.shadowBlur=70; ctx.shadowOffsetY=36;
  ctx.drawImage(PACK,-w/2,-h/2,w,h);
  ctx.restore();
}

// photo scene: Ken Burns from the bowl of kilishi to the pack (real lifestyle photo)
function photoScene(t){
  const p=easeInOut(prog(t,0,2.7));
  const cover=H/PHOTO.height;           // 1.5
  const zoom=lerp(2.05,1.12,p);
  const s=cover*zoom;
  const fx=lerp(250,640,p), fy=lerp(930,720,p);   // focus point in photo pixels
  ctx.save(); ctx.translate(W/2,H/2); ctx.scale(s,s); ctx.translate(-fx,-fy);
  ctx.drawImage(PHOTO,0,0); ctx.restore();
  // legibility gradients
  let g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(42,3,6,.35)'); g.addColorStop(.25,'rgba(42,3,6,0)'); g.addColorStop(.55,'rgba(42,3,6,0)'); g.addColorStop(1,'rgba(42,3,6,.85)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

// ---------- main frame ----------
function drawFrame(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
  const [sx,sy]=shake(t);

  // SCENE 1 (0–2.7): real photo, push from the kilishi bowl to the pack
  if(t<2.75){
    ctx.save(); ctx.translate(sx,sy); photoScene(t); ctx.restore();
    ctx.save(); ctx.translate(sx,sy);
    const out=1-prog(t,2.2,2.5);
    ctx.globalAlpha=out;
    stamp('REAL TASTE.',W/2,1470,140,prog(t,.4,.8),C.white);
    stamp('REAL CULTURE.',W/2,1630,140,prog(t,1.05,1.45),C.gold);
    ctx.restore();
  }

  // SCENES 2–4 on the red stage
  if(t>=2.55){
    redStage(t);
    flakesLayer(t,.8);
    ctx.save(); ctx.translate(sx,sy);
    const drop=bounceOut(prog(t,2.6,3.4));
    let py=lerp(-800,900,drop), ps=1, pr=Math.sin(t*1.3)*.02;
    py+=Math.sin(t*2)*8*prog(t,3.4,3.8);
    const up=easeInOut(prog(t,5.2,5.7)); py=lerp(py,700+Math.sin(t*2)*8,up); ps=lerp(1,.8,up);
    const end=easeInOut(prog(t,7.8,8.3)); py=lerp(py,660+Math.sin(t*2)*8,end); ps=lerp(ps,.74,end);

    // kilishi chips burst out from behind the pack
    const b=easeOutBack(prog(t,2.98,3.6));
    if(b>0){
      chips.forEach((ch,i)=>{
        const ang=-1.35+i*(2.7/(chips.length-1));
        const rad=(360+(i%2)*90)*b*ps; const bob=Math.sin(t*2.2+i)*10;
        drawChip(ch,W/2+Math.sin(ang)*rad*1.15,py-Math.cos(ang)*rad*.95+bob,ang+t*.2*(i%2?1:-1),ps*1.05*clamp(b),clamp(b*2));
      });
    }
    drawPack(W/2,py,ps,pr);

    // scene 2 headline
    ctx.save(); ctx.globalAlpha=1-prog(t,5.0,5.25);
    stamp('AUTHENTIC',W/2,190,92,prog(t,3.5,3.85),C.white,BODY,'800');
    stamp('NIGERIAN KILISHI',W/2,1640,118,prog(t,3.85,4.2),C.white);
    stamp('BEEF JERKY · BEEF · CHILI · SPICES',W/2,1755,34,prog(t,4.2,4.5),C.cream,BODY,'600');
    ctx.restore();

    // scene 3 badges (claims taken from the pack)
    const bout=easeInCubic(prog(t,7.7,8.05));
    ctx.save(); ctx.translate(-bout*1500,0);
    badge('HIGH PROTEIN','52G PROTEIN PER 100G',W/2,1250,prog(t,5.45,5.9),'protein');
    badge('100% PREMIUM BEEF','NOTHING BUT REAL BEEF',W/2,1420,prog(t,6.05,6.5),'heart');
    badge('HYGIENICALLY PACKED','MADE TO A MODERN STANDARD',W/2,1590,prog(t,6.65,7.1),'shield');
    ctx.restore();

    // scene 4 end card
    stamp('For those who appreciate',W/2,1235,78,prog(t,8.25,8.6),C.white,SCRIPT,'400');
    stamp('good things.',W/2,1345,112,prog(t,8.6,8.95),C.gold,SCRIPT,'400');
    const cta=prog(t,9.0,9.3);
    if(cta>0){
      const s=easeOutBack(cta)*(1+.035*Math.sin((t-9)*9)*prog(t,9.3,9.45));
      ctx.save(); ctx.translate(W/2,1560); ctx.scale(s,s);
      ctx.shadowColor='rgba(40,0,0,.45)'; ctx.shadowBlur=40; ctx.shadowOffsetY=12;
      rrect(-320,-72,640,144,72); ctx.fillStyle=C.white; ctx.fill(); ctx.shadowColor='transparent';
      ctx.fillStyle=C.red; ctx.font=`800 70px ${HEAD}`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('GRAB A PACK →',0,6); ctx.restore();
      ctx.save(); ctx.globalAlpha=clamp(cta*2); ctx.fillStyle=C.white; ctx.textAlign='center';
      ctx.font=`800 34px ${BODY}`; spacing(3); ctx.fillText('@Guto Kilishi',W/2,1715);
      ctx.font=`600 26px ${BODY}`; ctx.fillStyle=C.cream; ctx.fillText('PROUDLY NIGERIAN · LOCALLY SOURCED',W/2,1770); spacing(0); ctx.restore();
    }
    ctx.restore();
  }

  // transition: red iris wipe from the photo into the red stage
  if(t>=2.4 && t<2.9){
    const k=easeInOut(prog(t,2.4,2.75));
    if(t<2.75){
      ctx.save(); ctx.beginPath(); ctx.arc(W/2,H/2,k*1200,0,6.283); ctx.clip();
      redStage(t); ctx.restore();
    }
    const fl=1-prog(t,2.75,2.95); ctx.fillStyle=`rgba(255,240,230,${fl*.5*(t>=2.75)})`; ctx.fillRect(0,0,W,H);
  }

  // vignette
  const v=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.8); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(30,0,0,.45)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  // fade in / out
  const fade=Math.max(1-prog(t,0,.15), prog(t,9.75,10));
  if(fade>0){ctx.fillStyle=`rgba(0,0,0,${fade})`;ctx.fillRect(0,0,W,H);}
}
window.drawFrame=drawFrame;
window.ready=Promise.all([loadImg('assets/pack_cutout.png'),loadImg('assets/lifestyle.jpg'),
  document.fonts.load('800 100px "Baloo 2"'),document.fonts.load('100px "Kaushan Script"'),document.fonts.load('800 30px Montserrat'),document.fonts.load('600 30px Montserrat')])
  .then(([p,ph])=>{PACK=p;PHOTO=ph;return document.fonts.ready;});

if(!location.search.includes('render')){
  window.ready.then(()=>{const t0=performance.now();(function loop(){drawFrame(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop);})();});
}
</script>
</body>
</html>
